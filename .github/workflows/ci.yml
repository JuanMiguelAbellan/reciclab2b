name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest

        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ALLOW_EMPTY_PASSWORD: true
                    MYSQL_DATABASE: testing
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=10

        steps:
            - uses: actions/checkout@v4

            - name: Instalar PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: mbstring, pdo_mysql, gd, exif, pcntl, bcmath
                  coverage: none

            - name: Instalar Node
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm

            - name: Copiar .env
              run: cp .env.example .env

            - name: Instalar dependencias de Composer
              run: composer install --no-interaction --prefer-dist --optimize-autoloader

            - name: Instalar dependencias de npm
              run: npm ci

            - name: Generar APP_KEY
              run: php artisan key:generate

            - name: Comprobar tipos TypeScript
              run: npx tsc --noEmit

            - name: Build de producción del frontend
              run: npm run build

            - name: Comprobar formato PHP (Pint)
              run: ./vendor/bin/pint --test

            - name: Ejecutar tests
              env:
                  DB_HOST: 127.0.0.1
                  DB_PORT: 3306
                  DB_USERNAME: root
                  DB_PASSWORD: ''
              run: php artisan test
